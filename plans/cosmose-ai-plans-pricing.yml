detail: >-
  Cosmose AI publishes no pricing of any kind. There is no /pricing route, no plans page and no self-serve signup on
  cosmose.ai, cosmose.co or kaikai.ai. The Angular router bundle on cosmose.ai declares 20 routes — home, about-us,
  blog, careers, privacy-policy, opt-out, web3, results, gdms, landing-page, plus campaign pages (bcg-report,
  pwc-report, predict-tomorrow, sell-more, understand-now, hainan-shoppers-package, premium-skincare-brand-case-study,
  chinas-retail-travel-trends-and-predictions-for-2022, coronavirusstaysafeoptout) — and none of them is a pricing,
  plans, signup or developer route. Commercial engagement is enterprise contact-sales only: the site's conversion
  events are email-capture and report-download forms, and kaikai.ai offers a merchant-signup lead form rather than an
  account.
