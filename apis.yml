aid: cosmose-ai
name: Cosmose AI
description: >-
  Cosmose AI (Cosmose Inc.) is a Singapore-headquartered, Polish-founded retail intelligence company that
  measures, predicts and influences offline shopping behaviour at scale, claiming reach across roughly one
  billion consumers through an SDK embedded in partner mobile applications. Founded in 2014 by Miron Mironiuk
  with offices in Singapore, Warsaw, Paris, Hong Kong, Shanghai and Tokyo, it sells offline footfall and
  purchase-intent analytics plus online-to-offline ad targeting to brands including LVMH, Richemont, L'Oreal and
  Estee Lauder, and operates two consumer-facing products — Cosmose Media (the advertising side) and KaiKai /
  KaiKaiNow, a gamified "shoppertainment" and lock-screen app built with the NEAR Foundation. Cosmose does not
  run a public developer program: there is no developer portal, no published API reference, no pricing page and
  no self-serve signup. Its API surface is nonetheless partly public — an unauthenticated springdoc OpenAPI 3.0.1
  document for the KaiKai Deal Hunter registration service is served from the Singapore gateway, and its iOS
  SDKs are distributed through a first-party CocoaPods spec repository on GitHub.
image: https://cosmose.ai/assets/imgs/open-graph-logo.jpeg
