apis:
- name: Cosmose AI Deal Hunter Registration API
  description: >-
    Registration, onboarding, invitation and account-lifecycle service behind Cosmose AI's KaiKai / Deal Hunter
    consumer app, plus the merchant, school, newsletter and contact lead-capture forms on kaikai.ai and
    cosmose.ai. 24 operations across registration, waiting list, invitation issuance and usage, JWT token and
    refresh-token issuance, admin approval of waiting-list users, and a GDPR-style forget-me delete/restore pair.
    The OpenAPI is served unauthenticated from the Singapore gateway; the operations themselves apply a global
    bearerAuth (JWT) requirement.
  humanURL: https://api.sg.cosmose.co/deal-hunter-registration-api/swagger-ui.html
  baseURL: https://api.sg.cosmose.co/deal-hunter-registration-api
