x-gaps-for-the-provider:
  - id: no-operation-summaries
    detail: >-
      All 24 operations carry an operationId and a tag but zero `summary` and zero `description`. springdoc emits what
      the Java code carries; adding @Operation(summary=..) is a one-line-per-method fix.
    affected_operations: 24
  - id: springdoc-controller-tags
    detail: >-
      Tags are raw Spring bean names (`forget-me-controller`, `kkn-onboarding-controller`, `crucible-token-controller`)
      rather than consumer-facing resource names, and no top-level `tags[]` block declares or describes them.
    affected_tags:
      - forget-me-controller
      - registration-admin-controller
      - invitation-controller
      - token-controller
      - onboarding-controller
      - kkn-onboarding-controller
      - crucible-token-controller
      - school-controller
      - registration-controller
      - newsletter-controller
      - merchant-controller
      - learn-to-code-controller
      - contact-form-controller
  - id: collision-suffixed-operationids
    detail: >-
      Four operationIds are springdoc collision suffixes rather than names — `register_1`, `register_2`,
      `confirmRegistration_1`, `generateTokens_1`, `subscribeToNewsletter_1`. They are unique, so the contract is
      valid, but a generated SDK exposes methods no reader can identify.
  - id: wildcard-response-media-type
    detail: >-
      Every response body is declared under the `*/*` media type instead of `application/json`, which is what the
      service actually returns. Generated clients cannot negotiate content, and tooling cannot tell JSON from anything
      else.
  - id: no-examples
    detail: No request or response `example`/`examples` anywhere in the document.
  - id: no-401-declared
    detail: >-
      The document declares 200/400/403/404 on all 24 operations and applies `bearerAuth` globally, but never declares
      401 — even though the sibling gateway hosts (api.cosmose.co, api.sg.cosmose.co root) demonstrably answer
      `{"error":"unauthorized"}` with HTTP 401. The contract does not describe the failure a caller hits first.
