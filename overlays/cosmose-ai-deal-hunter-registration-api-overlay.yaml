actions:
  - target: $.info
    description: >-
      Upstream ships the springdoc defaults ("OpenAPI definition" / version "v0") with no description. Replaced the
      title with the real service name observed on the gateway path, and added a description recording provenance.
    update:
      title: Cosmose AI Deal Hunter Registration API
      description: >-
        Public registration, onboarding, invitation and account-lifecycle API behind Cosmose AI's KaiKai / Deal Hunter
        consumer app and its merchant and school lead-capture forms.
      x-harvested-from: https://api.sg.cosmose.co/deal-hunter-registration-api/v3/api-docs
  - target: $.servers
    description: >-
      HARD DEFECT IN THE PUBLISHED CONTRACT, not a preference. Upstream advertises
      `http://deal-hunter-registration-api/deal-hunter-registration-api` — the internal Kubernetes service DNS name
      springdoc inferred from the request it saw, over plaintext http, with the context path duplicated. That host does
      not resolve for any consumer outside the cluster, so a client generated straight from the published document
      cannot make a single call. Replaced with the gateway origin the document was actually served from and confirmed
      reachable. This is the single highest-value fix available on this spec and it belongs upstream: setting
      springdoc's `server-url` (or a `@OpenAPIDefinition(servers=...)`) would fix it at the source for every consumer.
    update:
