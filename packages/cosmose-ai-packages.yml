gaps:
- >-
  No Android SDK is published anywhere public, despite the product being an in-app location SDK whose reach claim
  ("1B people") is necessarily dominated by Android in the Asian markets Cosmose sells.
- >-
  No server-side client library exists in any language for the API surface that does have a public contract.
- >-
  The binary host repo.cosmose.co/repository/ios-sdk-releases/ returns HTTP 401 on directory listing, so no consumer
  can enumerate available versions; the GitHub spec repo is the only public version index.
- >-
  Every package is `license: Proprietary` with an empty license text, so a consumer evaluating the SDK has no terms to
  read before embedding a location-tracking library in their own app.
