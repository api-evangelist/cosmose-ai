observations:
- >-
  There is no GET-by-id operation for any entity. The service is write-mostly: 19 of 24 operations are POST/PUT/DELETE
  and the only three reads are an invitation-usage lookup, a confirmed-registration counter, and the admin
  waiting-list page. Nothing is addressable as a resource, so this is an RPC-shaped form-and-onboarding backend
  wearing REST paths, not a resource API.
- >-
  Six of the 24 operations (schools, newsletter, learn-to-code, contact forms, merchants) are marketing-site form
  handlers that happen to share a deployment with the consumer identity service. They are unrelated domains in one
  contract.
