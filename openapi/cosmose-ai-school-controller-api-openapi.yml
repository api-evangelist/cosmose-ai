openapi: 3.2.0
info:
  title: Cosmose AI Deal Hunter Registration School Controller API
  description: Public registration, onboarding, invitation and account-lifecycle API behind Cosmose AI's KaiKai / Deal Hunter consumer app and its merchant and school lead-capture forms.
  version: v0
  x-harvested-from: https://api.sg.cosmose.co/deal-hunter-registration-api/v3/api-docs
  x-upstream-info:
    title: OpenAPI definition
    version: v0
servers:
- url: https://api.sg.cosmose.co/deal-hunter-registration-api
  description: Singapore production gateway (observed reachable, HTTP 200 on /v3/api-docs)
security:
- bearerAuth: []
tags:
- name: school-controller
paths:
  /v1/schools:
    post:
      tags:
      - school-controller
      operationId: saveSchool
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchoolDto'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: OK
      summary: Save school
      x-summary-source: derived
  /v1/schools/newsletter:
    post:
      tags:
      - school-controller
      operationId: subscribeToNewsletter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeDto'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: OK
      deprecated: true
      summary: Subscribe to newsletter
      x-summary-source: derived
components:
  schemas:
    ErrorDto:
      type: object
      properties:
        errorCode:
          type: string
          enum:
          - BAD_REQUEST
          - CODE_EXCEEDED
          - CODE_NOT_FOUND
          - USER_ALREADY_REGISTERED
          - USER_NOT_FOUND
          - FORBIDDEN
          - MAX_RESETS_EXCEEDED
          - INVITATION_DAILY_LIMIT_EXCEEDED
          - EMAIL_ALREADY_TAKEN
        message:
          type: string
    CreateSchoolDto:
      required:
      - city
      - coordinatorName
      - email
      - name
      - phoneNumber
      - studentsNumber
      - voivodeship
      type: object
      properties:
        name:
          type: string
        coordinatorName:
          type: string
        city:
          type: string
        voivodeship:
          type: string
        email:
          type: string
        phoneNumber:
          pattern: ^\+?[\d \-]{8,17}$
          type: string
        studentsNumber:
          type: integer
          format: int32
    SubscribeDto:
      required:
      - email
      type: object
      properties:
        email:
          type: string
        source:
          type: string
        language:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
x-evidence:
  fetched: '2026-08-11'
  url: https://api.sg.cosmose.co/deal-hunter-registration-api/v3/api-docs
  http_status: 200
  content_type: application/json
